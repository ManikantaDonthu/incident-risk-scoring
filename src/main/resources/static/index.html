<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Incident Risk Scoring</title><style>body{font:15px Arial;max-width:1000px;margin:30px auto;padding:0 16px}section{border:1px solid #ddd;border-radius:8px;padding:16px;margin:16px 0}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}button{padding:6px 10px;cursor:pointer}</style></head><body><h1>Incident Case Risk Scoring</h1><section><h2>Available alerts</h2><table><thead><tr><th>Title</th><th>Category</th><th>Host</th><th>Score</th><th></th></tr></thead><tbody id="alerts"></tbody></table></section><section><h2>Case</h2><input id="name" value="New incident case"><button onclick="createCase()">Create case</button><span id="caseId"></span><div id="case"></div></section><script>
let cid=null;async function api(u,o={}){let r=await fetch(u,{headers:{'Content-Type':'application/json'},...o});if(!r.ok)throw Error(await r.text());return r.json()}
async function load(){let a=await api('/api/alerts');document.querySelector('#alerts').innerHTML=a.map(x=>`<tr><td>${x.title}</td><td>${x.category}</td><td>${x.sourceHost}</td><td>${x.baseScore}</td><td><button onclick="add(${x.id})">Add to case</button></td></tr>`).join('')}
async function createCase(){let c=await api('/api/cases',{method:'POST',body:JSON.stringify({name:document.querySelector('#name').value})});cid=c.id;document.querySelector('#caseId').textContent=' Case #'+cid;await refresh()}
async function add(id){if(!cid)return alert('Create a case first');await api(`/api/cases/${cid}/alerts/${id}`,{method:'POST'});await refresh()}
async function remove(id){await api(`/api/cases/${cid}/alerts/${id}`,{method:'DELETE'});await refresh()}
async function apply(){let p=[...document.querySelectorAll('.pol:checked')].map(x=>x.value);await api(`/api/cases/${cid}/policies`,{method:'PUT',body:JSON.stringify({policies:p})});await refresh()}
async function refresh(){let c=await api(`/api/cases/${cid}`),s=await api(`/api/cases/${cid}/score`);document.querySelector('#case').innerHTML=`<h3>${c.name}</h3><h4>Alerts</h4>${c.alerts.map(a=>`${a.title} (${a.baseScore}) <button onclick="remove(${a.id})">Remove</button><br>`).join('')||'No alerts selected'}<h4>Policies</h4>${[['REPEAT_NOISE_DAMPING','Repeat noise damping'],['CRITICAL_ASSET_BOOST','Critical asset boost'],['APT_CAMPAIGN_LINK','APT campaign link']].map(([v,l])=>`<label><input class="pol" type="checkbox" value="${v}" ${c.policies.includes(v)?'checked':''}>${l}</label><br>`).join('')}<button onclick="apply()">Apply policies</button><h3>Score summary</h3>Raw: ${s.rawScore}<br>Adjustments: ${s.adjustments.join(', ')||'None'}<br>Final: <b>${s.finalScore}/100</b><br>Severity: <b>${s.severity}</b>`}
load().catch(e=>alert(e.message));</script></body></html>
