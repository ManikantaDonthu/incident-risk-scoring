spring:
  application:
    name: incident-risk-scoring
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:riskdb}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:incident-risk-group}
    listener:
      auto-startup: ${KAFKA_ENABLED:false}
server:
  port: ${PORT:8080}
